<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynoSync | Bring Synology sync into your iPhone file workflow</title>
    <meta name="description" content="SynoSync syncs Synology NAS folders to any user-authorized directory on iPhone and iPad, so Obsidian and other file-based apps can work directly with your files.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f2ea;
            --surface: rgba(255, 252, 247, 0.78);
            --surface-strong: #fffaf2;
            --text: #1f1a17;
            --muted: #6c6057;
            --line: rgba(31, 26, 23, 0.1);
            --accent: #0f7c6d;
            --accent-2: #ef8354;
            --accent-3: #1a4d8f;
            --shadow: 0 20px 60px rgba(43, 29, 16, 0.12);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --max-width: 1180px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Noto Sans SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(239, 131, 84, 0.18), transparent 28%),
                radial-gradient(circle at 85% 12%, rgba(15, 124, 109, 0.18), transparent 24%),
                linear-gradient(180deg, #fbf8f2 0%, #f2ede4 48%, #f8f5ef 100%);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            position: relative;
            overflow: hidden;
        }

        .page-shell::before,
        .page-shell::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(18px);
            z-index: 0;
            opacity: 0.7;
        }

        .page-shell::before {
            width: 360px;
            height: 360px;
            background: rgba(26, 77, 143, 0.08);
            top: 120px;
            right: -110px;
        }

        .page-shell::after {
            width: 280px;
            height: 280px;
            background: rgba(239, 131, 84, 0.14);
            left: -80px;
            top: 640px;
        }

        .container {
            width: min(var(--max-width), calc(100% - 40px));
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .site-header {
            padding: 24px 0 8px;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 18px;
            border: 1px solid var(--line);
            background: rgba(255, 250, 242, 0.72);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            box-shadow: 0 12px 30px rgba(43, 29, 16, 0.06);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(145deg, var(--accent) 0%, var(--accent-3) 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--muted);
            font-size: 14px;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.12fr) minmax(320px, 0.88fr);
            gap: 28px;
            align-items: stretch;
            padding: 42px 0 28px;
        }

        .hero-copy,
        .hero-panel,
        .section-card,
        .story-panel,
        .cta-card {
            border: 1px solid var(--line);
            background: var(--surface);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }

        .hero-copy {
            border-radius: var(--radius-xl);
            padding: 40px;
            animation: rise 0.9s ease both;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            color: var(--accent-3);
            background: rgba(26, 77, 143, 0.08);
            margin-bottom: 18px;
        }

        h1, h2, h3 {
            margin: 0;
            line-height: 1.02;
        }

        h1 {
            font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
            font-size: clamp(46px, 7vw, 84px);
            letter-spacing: -0.04em;
            max-width: 11ch;
        }

        .lead {
            font-size: 18px;
            line-height: 1.8;
            color: var(--muted);
            margin: 22px 0 0;
            max-width: 40rem;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 28px;
        }

        .button,
        .button-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 56px;
            padding: 0 22px;
            border-radius: 999px;
            font-weight: 700;
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .button {
            color: #fff;
            background: linear-gradient(135deg, var(--accent) 0%, #14614d 100%);
            box-shadow: 0 18px 40px rgba(15, 124, 109, 0.22);
        }

        .button-secondary {
            color: var(--text);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.58);
        }

        .button:hover,
        .button-secondary:hover,
        .feature-card:hover,
        .mini-card:hover {
            transform: translateY(-2px);
        }

        .hero-meta {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 32px;
        }

        .mini-card {
            padding: 16px;
            border-radius: 20px;
            border: 1px solid rgba(31, 26, 23, 0.08);
            background: rgba(255, 255, 255, 0.72);
            transition: transform 180ms ease, background 180ms ease;
        }

        .mini-card strong,
        .stat strong {
            display: block;
            font-family: "Space Grotesk", sans-serif;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .mini-card span,
        .stat span,
        .feature-card p,
        .story-panel p,
        .note,
        .footer-text {
            color: var(--muted);
            line-height: 1.7;
        }

        .hero-panel {
            border-radius: var(--radius-xl);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
            animation: rise 1s ease 0.1s both;
        }

        .device-frame {
            position: relative;
            border-radius: 36px;
            padding: 18px;
            background: linear-gradient(180deg, #1d272c 0%, #0e1418 100%);
            color: #edf4f7;
            min-height: 430px;
            overflow: hidden;
        }

        .device-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(15, 124, 109, 0.28), transparent 38%);
        }

        .device-notch {
            width: 34%;
            height: 24px;
            margin: 0 auto 22px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
        }

        .sync-flow {
            position: relative;
            z-index: 1;
            display: grid;
            gap: 14px;
        }

        .flow-node {
            padding: 18px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .flow-node strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .flow-arrow {
            width: 2px;
            height: 34px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(239, 131, 84, 0.15), rgba(239, 131, 84, 0.9));
        }

        .status-strip {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill {
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(255, 250, 242, 0.92);
            color: #082f29;
            border: 1px solid rgba(15, 124, 109, 0.28);
            font-size: 13px;
            font-weight: 700;
        }

        .section {
            padding: 28px 0;
        }

        .section-title {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .section-title h2 {
            font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
            font-size: clamp(32px, 4vw, 52px);
            letter-spacing: -0.04em;
            max-width: 12ch;
        }

        .section-title p {
            max-width: 34rem;
            color: var(--muted);
            line-height: 1.8;
            margin: 0;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .feature-card,
        .section-card,
        .story-panel,
        .cta-card {
            border-radius: var(--radius-lg);
            transition: transform 180ms ease, border-color 180ms ease;
        }

        .feature-card {
            padding: 24px;
            background: rgba(255, 251, 245, 0.82);
            border: 1px solid var(--line);
            box-shadow: 0 12px 28px rgba(43, 29, 16, 0.08);
        }

        .feature-index {
            font-family: "Space Grotesk", sans-serif;
            font-size: 13px;
            letter-spacing: 0.12em;
            color: var(--accent);
            text-transform: uppercase;
        }

        .feature-card h3 {
            font-size: 24px;
            margin: 14px 0 12px;
        }

        .story-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
            gap: 18px;
        }

        .story-panel,
        .section-card,
        .cta-card {
            padding: 28px;
        }

        .quote {
            font-size: clamp(24px, 3vw, 36px);
            line-height: 1.35;
            margin: 0 0 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 28px;
        }

        .stat {
            padding: 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(31, 26, 23, 0.08);
        }

        .workflow {
            display: grid;
            gap: 14px;
        }

        .workflow-step {
            display: grid;
            grid-template-columns: 54px minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }

        .workflow-step strong {
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            border-radius: 18px;
            font-family: "Space Grotesk", sans-serif;
            font-size: 20px;
            color: #fff;
            background: linear-gradient(145deg, var(--accent-2), #d05d2b);
        }

        .workflow-step h3 {
            margin-bottom: 8px;
            font-size: 20px;
        }

        .note {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: 18px;
            background: rgba(15, 124, 109, 0.08);
            border: 1px solid rgba(15, 124, 109, 0.14);
        }

        .cta-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 20px;
            align-items: center;
            background:
                linear-gradient(135deg, rgba(255, 250, 242, 0.96), rgba(255, 244, 231, 0.96)),
                radial-gradient(circle at top right, rgba(15, 124, 109, 0.14), transparent 32%);
        }

        .cta-copy h2 {
            font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
            font-size: clamp(30px, 4vw, 48px);
            letter-spacing: -0.04em;
            margin-bottom: 14px;
        }

        .cta-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-end;
        }

        .site-footer {
            padding: 22px 0 44px;
        }

        .footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-top: 1px solid rgba(31, 26, 23, 0.1);
            padding-top: 18px;
        }

        .footer-text {
            margin: 0;
            font-size: 14px;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1040px) {
            .hero,
            .story-grid,
            .cta-card {
                grid-template-columns: 1fr;
            }

            .feature-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .cta-actions {
                justify-content: flex-start;
            }
        }

        @media (max-width: 720px) {
            .container {
                width: min(var(--max-width), calc(100% - 24px));
            }

            .nav {
                border-radius: 28px;
                padding: 16px;
            }

            .nav-links {
                display: none;
            }

            .hero-copy,
            .hero-panel,
            .feature-card,
            .story-panel,
            .section-card,
            .cta-card {
                padding: 22px;
            }

            .hero-meta,
            .stats,
            .feature-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                align-items: start;
                flex-direction: column;
            }

            .device-frame {
                min-height: 360px;
            }

            .footer-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

        const languageMap = {
            zh: "zh-CN",
            "zh-cn": "zh-CN",
            "zh-hans": "zh-CN",
            en: "en",
            ja: "ja",
            jp: "ja",
            ko: "ko",
            "ko-kr": "ko",
            fr: "fr",
            de: "de",
            ru: "ru"
        };

        function detectLocale() {
            const candidates = [...(navigator.languages || []), navigator.language]
                .filter(Boolean)
                .map((value) => value.toLowerCase());

            for (const candidate of candidates) {
                if (languageMap[candidate]) {
                    return languageMap[candidate];
                }

                const baseLanguage = candidate.split("-")[0];
                if (baseLanguage === "zh") {
                    return candidate === "zh" ? "zh-CN" : "en";
                }
                if (languageMap[baseLanguage]) {
                    return languageMap[baseLanguage];
                }
            }

            return "en";
        }

        function applyTranslations(locale) {
            const resolvedLocale = translations[locale] ? locale : "en";
            const copy = translations[resolvedLocale];

            document.documentElement.lang = resolvedLocale;
            document.title = copy.pageTitle;

            const description = document.querySelector('meta[name="description"]');
            if (description) {
                description.setAttribute("content", copy.pageDescription);
            }

            document.querySelectorAll("[data-i18n]").forEach((element) => {
                const key = element.dataset.i18n;
                if (copy[key]) {
                    element.textContent = copy[key];
                }
            });

            document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => {
                const key = element.dataset.i18nAriaLabel;
                if (copy[key]) {
                    element.setAttribute("aria-label", copy[key]);
                }
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("year").textContent = new Date().getFullYear();
            applyTranslations(detectLocale());
        });
    </script>
